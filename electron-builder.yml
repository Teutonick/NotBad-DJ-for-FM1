appId: com.wincha.minidj
productName: NotBad DJ for FM1
copyright: Copyright © Wincha

directories:
  output: release
  buildResources: build

# Solo entra en el paquete lo necesario: el bundle web, el wrapper y el manifiesto
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - build/icon.png
  - LICENSE
  - DISCLAIMER.md
  - docs/UPSTREAM.md
  - firmware/licenses/**/*

asar: true
# No hay dependencias nativas: no hace falta recompilar nada
npmRebuild: false

# Publicación en GitHub Releases (lo usa el workflow de Actions). De aquí
# lee también electron-updater (activo en Windows y AppImage) dónde buscar
# versiones nuevas. Se sube como BORRADOR a propósito, y un borrador no lo
# ve el updater: hay que publicarlo. Ver README ("Auto-update").
publish:
  - provider: github
    owner: Teutonick
    repo: NotBad-DJ-for-FM1
    releaseType: draft

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Sin certificado: el instalador no va firmado (aviso de SmartScreen)
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NotBad DJ for FM1
  artifactName: ${productName}-${version}-win-x64-setup.${ext}

portable:
  artifactName: ${productName}-${version}-win-x64-portable.${ext}

linux:
  icon: build/icon.png
  category: AudioVideo
  # Asocia la ventana con su entrada .desktop (icono correcto en la barra)
  syncDesktopName: true
  synopsis: Mesa de DJ de dos decks
  description: NotBad DJ for FM1 — two-deck DJ application for M-VAVE FM-1.
  desktop:
    entry:
      Name: NotBad DJ for FM1
      Categories: AudioVideo;Audio;Player;
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  # Chromium necesita estas librerías del sistema
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libasound2

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  # Sin cuenta de Apple Developer: ni firma ni notarización
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
