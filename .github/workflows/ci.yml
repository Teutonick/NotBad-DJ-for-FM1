name: Web checks and GitHub Pages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      publish_firmware:
        description: Publish the checked firmware for the selected version tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  firmware-safety:
    uses: ./.github/workflows/firmware-safety.yml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, firmware-safety]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production build
        id: deployment
        uses: actions/deploy-pages@v4

  publish-firmware:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_firmware && github.ref_type == 'tag'
    needs: firmware-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: firmware-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firmware-under-test
          path: firmware/dj/build
      - name: Verify the tag and publish the exact gated package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          version=$(node scripts/firmware/safety.mjs version)
          test "$GITHUB_REF_NAME" = "v$version"
          node scripts/firmware/safety.mjs publish-check
          cd firmware/dj/build
          shasum -a 256 --check safety/firmware.sha256
          cp safety/firmware.sha256 "fm1-dj-$version.fwsc.sha256"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "FM-1 DJ $version" --generate-notes \
            "fm1-dj-$version.fwsc" "fm1-dj-$version.fwsc.sha256"
