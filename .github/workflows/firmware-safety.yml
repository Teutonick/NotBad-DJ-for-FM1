name: FM-1 firmware safety

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/firmware/scope.sh
        id: scope
        env:
          FM1_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FM1_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

  build:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      manifest: ${{ steps.package.outputs.manifest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==12.2.0
      - name: Build exact package and check target layout
        id: package
        run: |
          bash scripts/firmware/safety.sh build
          report=firmware/dj/build/safety/memory-report.json
          echo "digest=$(node -p "require('./$report').digest")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(node -p "require('./$report').releaseManifest")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-under-test
          path: |
            firmware/dj/build/*.fwsc
            firmware/dj/build/safety/firmware.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: target-diagnostics
          path: firmware/dj/build/safety
          if-no-files-found: warn

  host:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==12.2.0
      - name: Compiler diagnostics, sanitizers, host simulator and BSP Flash tests
        run: bash scripts/firmware/safety.sh host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-diagnostics
          path: firmware/dj/build/safety
          if-no-files-found: warn

  fm1kit:
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firmware-under-test
          path: firmware/dj/build
      - run: cd firmware/dj/build && shasum -a 256 --check safety/firmware.sha256
      - run: bash scripts/firmware/safety.sh prepare-fm1kit
      - run: bash scripts/firmware/safety.sh package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fm1kit-diagnostics
          path: firmware/dj/build/safety
          if-no-files-found: warn

  emulator_puya:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firmware-under-test
          path: firmware/dj/build
      - run: cd firmware/dj/build && shasum -a 256 --check safety/firmware.sha256
      - name: Verify and install pinned fm1-live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64 libx11-6 libxkbcommon0 libxcursor1 libxrandr2 libxi6
          bash scripts/firmware/safety.sh prepare-emulator
      - run: bash scripts/firmware/safety.sh emulator p25q80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emulator-p25q80
          path: |
            firmware/dj/build/safety/p25q80/*.log
            firmware/dj/build/safety/p25q80/*.ppm
          if-no-files-found: warn

  emulator_uc25hq80:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firmware-under-test
          path: firmware/dj/build
      - run: cd firmware/dj/build && shasum -a 256 --check safety/firmware.sha256
      - name: Verify and install pinned fm1-live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64 libx11-6 libxkbcommon0 libxcursor1 libxrandr2 libxi6
          bash scripts/firmware/safety.sh prepare-emulator
      - run: bash scripts/firmware/safety.sh emulator uc25hq80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emulator-uc25hq80
          path: |
            firmware/dj/build/safety/uc25hq80/*.log
            firmware/dj/build/safety/uc25hq80/*.ppm
          if-no-files-found: warn

  installer:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: bash scripts/firmware/safety.sh installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-diagnostics
          path: firmware/dj/build/safety
          if-no-files-found: warn

  gate:
    name: Firmware Safety Gate
    if: always()
    needs: [scope, build, host, fm1kit, emulator_puya, emulator_uc25hq80, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Require all mandatory evidence
        env:
          FM1_SAFETY_JOBS: ${{ toJSON(needs) }}
        run: node scripts/firmware/safety.mjs report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firmware-safety-report
          path: firmware/dj/build/safety
          if-no-files-found: warn
