name: FM-1 DJ firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==12.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: firmware/build.sh --host
      - run: node firmware/test-host.mjs
      - run: firmware/base/tools/setup_toolchain.sh --only jieli,ac79-sdk
      - run: firmware/build.sh --release 0.1.0
      - run: cd firmware/dj/build && sha256sum fm1-dj-0.1.0.fwsc > fm1-dj-0.1.0.fwsc.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-dj-0.1.0
          path: |
            firmware/dj/build/*.fwsc
            firmware/dj/build/*.sha256
            firmware/dj/build/firmware.json
            firmware/licenses/*
          if-no-files-found: error
